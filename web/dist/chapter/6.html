    <h2>成象</h2>
  </header>

  <section class="ddj-block">
    <h3>原 文</h3>
    <div class="ddj-yuanwen">
<p>谷神不死，是谓玄牝。玄牝之门，是谓天地根。</p>
<p>绵绵若存，用之不勤。</p>

    </div>
  </section>

  <section class="ddj-block">
    <h3>白 话</h3>
    <div class="ddj-baihua">
<p>虚空的变化永不枯竭，这就叫"玄牝"——幽深的母体。这个母体的门户，就是天地的根源。</p>
<p>它绵延不断、若有若无，作用却永无穷尽。</p>

    </div>
  </section>

  <section class="ddj-block">
    <h3>导 读 · 编者解读</h3>
    <div class="ddj-daodu">
<p>"谷"是山谷，象征空虚；"牝"是雌性，象征生育。老子把"道"比作生养万物的母体：它空虚、幽深，却源源不断地生出天地万物。核心还是那句话——"空"和"柔"里藏着最大的生命力。</p>

    </div>
  </section>
