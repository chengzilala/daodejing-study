    <h2>俗薄</h2>
  </header>

  <section class="ddj-block">
    <h3>原 文</h3>
    <div class="ddj-yuanwen">
<p>大道废，有仁义；智慧出，有大伪；六亲不和，有孝慈；国家昏乱，有忠臣。</p>

    </div>
  </section>

  <section class="ddj-block">
    <h3>白 话</h3>
    <div class="ddj-baihua">
<p>大道被废弃了，才有人提倡仁义；智巧出现了，才产生严重的虚伪；家庭不和睦了，才凸显出孝慈；国家昏暗混乱了，才显出忠臣。</p>

    </div>
  </section>

  <section class="ddj-block">
    <h3>导 读 · 编者解读</h3>
    <div class="ddj-daodu">
<p>这一章很短，却很犀利：越是大声标榜什么，往往越说明那东西已经缺失了。老子不是反对仁义孝慈，而是提醒我们——当社会需要反复强调"要讲仁义"时，恰恰说明大道已经衰微。这是一种反向观察世事的方法。</p>

    </div>
  </section>
