    <h2>去用</h2>
  </header>

  <section class="ddj-block">
    <h3>原 文</h3>
    <div class="ddj-yuanwen">
<p>反者道之动，弱者道之用。天下万物生于有，有生于无。</p>

    </div>
  </section>

  <section class="ddj-block">
    <h3>白 话</h3>
    <div class="ddj-baihua">
<p>"反"（循环往复、物极必反），是"道"的运动规律；"弱"（柔弱），是"道"发挥作用的方式。天下万物从"有"中产生，而"有"从"无"中产生。</p>

    </div>
  </section>

  <section class="ddj-block">
    <h3>导 读 · 编者解读</h3>
    <div class="ddj-daodu">
<p>这一章极短，却是全书思想的浓缩："反者道之动"讲规律——事物总是循环往复、走向反面；"弱者道之用"讲方法——柔弱胜过刚强；"有生于无"讲本源——一切从"无"中来。三句话，把老子的宇宙观、方法观都概括了。</p>

    </div>
  </section>
