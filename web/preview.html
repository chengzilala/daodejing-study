<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道德经 · 原型预览</title>
<style>
  :root{
    --ddj-bg:#efe0b6;        /* 古卷黄底 */
    --ddj-card:#fbf1d3;      /* 古纸 */
    --ddj-ink:#3b2f1a;       /* 墨色 */
    --ddj-muted:#8a7a55;     /* 赭石 */
    --ddj-accent:#9a3324;    /* 印章红 */
    --ddj-line:#c8ac74;      /* 古铜边框 */
    --ddj-seal:#a6382c;      /* 印章底色 */
    --ddj-wood1:#c49a54;     /* 卷轴亮面 */
    --ddj-wood2:#8a6a33;     /* 卷轴暗面 */
    --ddj-speck:rgba(120,88,36,.06);   /* 纸面斑点 */
    --ddj-frame:rgba(150,120,60,.28);  /* 版框线 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background-color:var(--ddj-bg);
    background-image:
      radial-gradient(circle at 16% 22%, var(--ddj-speck) 0 1.5px, transparent 2px),
      radial-gradient(circle at 78% 55%, var(--ddj-speck) 0 1.5px, transparent 2px),
      radial-gradient(circle at 38% 82%, var(--ddj-speck) 0 2px, transparent 2.5px),
      radial-gradient(circle at 62% 12%, var(--ddj-speck) 0 1.5px, transparent 2px);
    color:var(--ddj-ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.7;
  }
  /* 古卷主体：上下各一根木质卷轴杆，中间是展开的卷面 */
  .ddj-wrap{max-width:860px;margin:0 auto;padding:40px 28px 72px;position:relative}
  .ddj-wrap::before,.ddj-wrap::after{
    content:"";position:absolute;left:0;right:0;height:14px;
    background:linear-gradient(var(--ddj-wood1),var(--ddj-wood2),var(--ddj-wood1));
    border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.28);
  }
  .ddj-wrap::before{top:8px}
  .ddj-wrap::after{bottom:8px}
  .ddj-header{text-align:center;margin-bottom:26px}
  .ddj-title{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:40px;font-weight:700;letter-spacing:10px}
  .ddj-seal{
    display:inline-block;width:40px;height:40px;background:var(--ddj-seal);
    color:#fff;border-radius:4px;font-family:"Noto Serif SC","Songti SC",serif;
    font-size:20px;line-height:40px;text-align:center;margin-left:8px;
    vertical-align:6px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
  }
  .ddj-subtitle{color:var(--ddj-muted);margin-top:10px;font-size:14px;letter-spacing:3px}
  .ddj-tabs{display:flex;justify-content:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
  .ddj-tab{
    padding:7px 18px;border:1px solid var(--ddj-line);border-radius:4px;
    background:var(--ddj-card);cursor:pointer;font-size:14px;color:var(--ddj-muted);
    transition:.2s;font-family:"Noto Serif SC","Songti SC",serif;
  }
  .ddj-tab.active{background:var(--ddj-accent);color:#fff;border-color:var(--ddj-accent)}
  .ddj-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .ddj-card{
    background:var(--ddj-card);border:1px solid var(--ddj-line);border-radius:4px;
    outline:1px solid var(--ddj-frame);outline-offset:-5px;
    padding:14px 12px;text-align:center;cursor:pointer;transition:.15s;
    font-family:"Noto Serif SC","Songti SC",serif;
  }
  .ddj-card:hover{border-color:var(--ddj-accent);transform:translateY(-2px)}
  .ddj-card .ddj-no{font-size:13px;color:var(--ddj-muted)}
  .ddj-card .ddj-topic{font-size:16px;margin-top:4px;font-weight:600}
  .ddj-card.has .ddj-no{color:var(--ddj-accent)}
  .ddj-card.empty{opacity:.5;cursor:not-allowed}
  /* 详情 */
  .ddj-detail .ddj-back{
    display:inline-block;margin-bottom:16px;color:var(--ddj-accent);
    cursor:pointer;font-size:14px;
  }
  .ddj-detail .ddj-h{text-align:center;margin-bottom:24px}
  .ddj-detail .ddj-h .ddj-no{font-size:15px;color:var(--ddj-muted);letter-spacing:3px}
  .ddj-detail .ddj-h h2{font-family:"Noto Serif SC","Songti SC",serif;font-size:30px;margin-top:6px;letter-spacing:6px}
  .ddj-block{
    background:var(--ddj-card);border:1px solid var(--ddj-line);border-radius:4px;
    outline:1px solid var(--ddj-frame);outline-offset:-5px;
    padding:24px 26px;margin-bottom:16px;
  }
  .ddj-block h3{font-size:14px;color:var(--ddj-accent);margin-bottom:12px;letter-spacing:3px;text-align:center}
  .ddj-block h3::before,.ddj-block h3::after{content:"──";color:var(--ddj-line);margin:0 8px}
  .ddj-yuanwen{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:21px;line-height:2.1}
  .ddj-yuanwen p{margin-bottom:8px}
  .ddj-baihua{font-size:16px}
  .ddj-baihua p{margin-bottom:10px}
  .ddj-daodu{font-size:15px;color:var(--ddj-ink);opacity:.88}
  .ddj-note{font-size:12px;color:var(--ddj-muted);text-align:center;margin-top:4px}
  .ddj-toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);
    background:rgba(0,0,0,.75);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;
    opacity:0;transition:.3s;pointer-events:none}
  .ddj-toast.show{opacity:1}
  /* 主题切换 */
  .ddj-theme-bar{display:flex;justify-content:center;gap:8px;margin-top:14px}
  .ddj-theme-btn{
    padding:4px 14px;border:1px solid var(--ddj-line);border-radius:4px;
    cursor:pointer;font-size:13px;color:var(--ddj-muted);
  }
  .ddj-theme-btn.active{background:var(--ddj-accent);color:#fff;border-color:var(--ddj-accent)}
  /* 墨色主题（覆盖变量） */
  body.ddj-ink{
    --ddj-bg:#27231d;
    --ddj-card:#33302a;
    --ddj-ink:#e6dcc2;
    --ddj-muted:#a2947a;
    --ddj-accent:#c0503c;
    --ddj-line:#574c38;
    --ddj-seal:#b03a2e;
    --ddj-wood1:#4a4032;
    --ddj-wood2:#2e2820;
    --ddj-speck:rgba(230,220,194,.05);
    --ddj-frame:rgba(200,180,140,.30);
  }
  @media(max-width:640px){
    .ddj-grid{grid-template-columns:repeat(2,1fr)}
    .ddj-yuanwen{font-size:18px}
  }
</style>
</head>
<body>
<div class="ddj-wrap">
  <header class="ddj-header">
    <h1 class="ddj-title">道德经<span class="ddj-seal">道</span></h1>
    <div class="ddj-subtitle">原文 · 白话 · 导读</div>
    <div class="ddj-theme-bar">
      <span class="ddj-theme-btn active" data-theme="light">古卷黄</span>
      <span class="ddj-theme-btn" data-theme="ink">墨色</span>
    </div>
  </header>

  <!-- 列表视图 -->
  <div id="ddjList">
    <div class="ddj-tabs" id="ddjTabs">
      <div class="ddj-tab active" data-g="all">全部</div>
      <div class="ddj-tab" data-g="dao">道篇（1–37）</div>
      <div class="ddj-tab" data-g="de">德篇（38–81）</div>
    </div>
    <div class="ddj-grid" id="ddjGrid"></div>
    <p class="ddj-note">原型预览：仅第 1 章已录入内容，其余章待补。</p>
  </div>

  <!-- 详情视图 -->
  <div id="ddjDetail" class="ddj-detail" style="display:none"></div>
</div>
<div class="ddj-toast" id="ddjToast"></div>

<script>
  var chapters = {
    1: {
      topic: "众妙之门",
      yuanwen: [
        "道可道，非常道；名可名，非常名。",
        "无名，天地之始；有名，万物之母。",
        "故常无欲，以观其妙；常有欲，以观其徼。",
        "此两者，同出而异名，同谓之玄。玄之又玄，众妙之门。"
      ],
      baihua: [
        "能说出来的“道”，就不是永恒不变的道；能叫出来的“名”，也不是永恒不变的名。",
        "“无”，是天地的开端；“有”，是万物的根源。",
        "所以，常保持无欲，去体会道的奥妙；常保持有欲，去观察道的显现。",
        "“无”和“有”来自同一个源头，只是名字不同，都很幽深。幽深之中还有幽深，是一切奥妙的总门。"
      ],
      daodu: "这一章是全书的总纲。老子先点明：“道”本身无法用言语讲清——一旦说出口，就已经不是那个永恒的道了。接着用“无”和“有”这对概念，讲万物如何从无到有。读懂这一章，后面八十章都围绕“道”在展开。"
    }
  };
  var currentGroup = "all";
  var grid = document.getElementById("ddjGrid");
  var tabs = document.querySelectorAll(".ddj-tab");

  function groupOf(n){ return n <= 37 ? "dao" : "de"; }

  function render(){
    grid.innerHTML = "";
    for(let i=1;i<=81;i++){
      if(currentGroup!=="all" && groupOf(i)!==currentGroup) continue;
      var c = document.createElement("div");
      var has = chapters[i];
      c.className = "ddj-card" + (has ? " has" : " empty");
      c.innerHTML = '<div class="ddj-no">第 ' + i + ' 章</div>' +
                    (has ? '<div class="ddj-topic">' + chapters[i].topic + '</div>' : '<div class="ddj-topic">待录入</div>');
      if(has){
        c.onclick = function(){ openDetail(i); };
      } else {
        c.onclick = function(){ toast("第 " + i + " 章内容待录入"); };
      }
      grid.appendChild(c);
    }
  }

  function openDetail(n){
    var d = chapters[n];
    var el = document.getElementById("ddjDetail");
    var yw = d.yuanwen.map(function(p){ return "<p>"+p+"</p>"; }).join("");
    var bh = d.baihua.map(function(p){ return "<p>"+p+"</p>"; }).join("");
    el.innerHTML =
      '<div class="ddj-back" onclick="closeDetail()">← 返回章节目录</div>' +
      '<div class="ddj-h"><div class="ddj-no">第 ' + n + ' 章</div><h2>' + d.topic + '</h2></div>' +
      '<div class="ddj-block"><h3>原 文</h3><div class="ddj-yuanwen">' + yw + '</div></div>' +
      '<div class="ddj-block"><h3>白 话</h3><div class="ddj-baihua">' + bh + '</div></div>' +
      '<div class="ddj-block"><h3>导 读 · 编者解读</h3><div class="ddj-daodu">' + d.daodu + '</div></div>' +
      '<p class="ddj-note">原文据通行本（王弼本）；白话、导读均为“编者解读”，非定论。</p>';
    document.getElementById("ddjList").style.display = "none";
    el.style.display = "block";
    window.scrollTo(0,0);
  }

  function closeDetail(){
    document.getElementById("ddjDetail").style.display = "none";
    document.getElementById("ddjList").style.display = "block";
  }

  var toastTimer;
  function toast(msg){
    var t = document.getElementById("ddjToast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1600);
  }

  tabs.forEach(function(tab){
    tab.addEventListener("click", function(){
      tabs.forEach(function(x){ x.classList.remove("active"); });
      tab.classList.add("active");
      currentGroup = tab.getAttribute("data-g");
      render();
    });
  });

  var themeBtns = document.querySelectorAll(".ddj-theme-btn");
  themeBtns.forEach(function(btn){
    btn.addEventListener("click", function(){
      themeBtns.forEach(function(x){ x.classList.remove("active"); });
      btn.classList.add("active");
      if(btn.getAttribute("data-theme") === "ink"){
        document.body.classList.add("ddj-ink");
      } else {
        document.body.classList.remove("ddj-ink");
      }
    });
  });

  render();
</script>
</body>
</html>
